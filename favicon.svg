<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161920"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <radialGradient id="crt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b0e13"/>
      <stop offset="100%" stop-color="#040507"/>
    </radialGradient>
  </defs>
  <!-- Outer Anodized Aluminum Bezel -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#chassis)" stroke="#262c36" stroke-width="1.5"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#050608" stroke-width="1"/>
  <!-- Corner Micro Hex Screws -->
  <circle cx="9.5" cy="9.5" r="2" fill="#07080a" stroke="#222730" stroke-width="0.8"/>
  <circle cx="54.5" cy="9.5" r="2" fill="#07080a" stroke="#222730" stroke-width="0.8"/>
  <circle cx="9.5" cy="54.5" r="2" fill="#07080a" stroke="#222730" stroke-width="0.8"/>
  <circle cx="54.5" cy="54.5" r="2" fill="#07080a" stroke="#222730" stroke-width="0.8"/>
  <!-- Recessed Machined Dial Ring -->
  <circle cx="32" cy="32" r="22" fill="url(#crt)" stroke="#1f252e" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#12161c" stroke-width="0.75" stroke-dasharray="2 2"/>
  <!-- Subtle Oscilloscope Grid Crosshair -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="#141820" stroke-width="0.75"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#141820" stroke-width="0.75"/>
  <!-- Parallel Track A (Warm Vintage Amber) -->
  <path d="M 14 26.5 C 18 26.5, 20 19, 23.5 19 C 27 19, 29 31, 32 31 C 35 31, 37 21, 40.5 21 C 44 21, 46 26.5, 50 26.5" fill="none" stroke="#b3834c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Parallel Track B (Muted Sage Phosphor) -->
  <path d="M 14 37.5 C 18 37.5, 20 31, 23.5 31 C 27 31, 29 44, 32 44 C 35 44, 37 33, 40.5 33 C 44 33, 46 37.5, 50 37.5" fill="none" stroke="#52857c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Phase Sync Indicator Dots -->
  <circle cx="14" cy="26.5" r="1.5" fill="#b3834c"/>
  <circle cx="50" cy="26.5" r="1.5" fill="#b3834c"/>
  <circle cx="14" cy="37.5" r="1.5" fill="#52857c"/>
  <circle cx="50" cy="37.5" r="1.5" fill="#52857c"/>
